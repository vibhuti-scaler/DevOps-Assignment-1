apiVersion: v1
kind: Service
metadata:
  name: web-headless
  namespace: devops-homework
spec:
  type: ClusterIP
  selector:
    app: stateful-web
  ports:
  - name: http
    port: 80
    targetPort: http
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-web
  namespace: devops-homework
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stateful-web
  template:
    metadata:
      labels:
        app: stateful-web
        version: v1
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        env:
        - name: APP_VERSION
          value: v1
        command:
        - /bin/sh
        - -c
        - |
          printf 'Hello from %s\n' "$APP_VERSION" > /usr/share/nginx/html/index.html
          exec nginx -g 'daemon off;'
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 3
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
  serviceName: web-headless
