apiVersion: v1
kind: Namespace
metadata:
  name: task-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api
  namespace: task-api
  labels:
    app: task-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-api
  template:
    metadata:
      labels:
        app: task-api
    spec:
      # Added after the Session 17 scanners flagged this manifest: Trivy
      # reported AVD-KSV-0014 and AVD-KSV-0118 against the original version,
      # which ran with the default security context and a writable root
      # filesystem. The before and after are in evidence/devsecops/.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: api
          # The CD workflow replaces this reference with the published digest
          # or tag; the manifest keeps a working default for local runs.
          image: task-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENVIRONMENT
              value: production
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: task-api
  namespace: task-api
spec:
  type: ClusterIP
  selector:
    app: task-api
  ports:
    - port: 80
      targetPort: http
