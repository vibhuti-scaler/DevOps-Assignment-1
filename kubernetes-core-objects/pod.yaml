apiVersion: v1
kind: Pod
metadata:
  name: standalone-web
  namespace: devops-homework
  labels:
    app: standalone-web
spec:
  containers:
  - name: web
    image: nginx:1.28-alpine
    env:
    - name: APP_VERSION
      value: v1
    command:
    - /bin/sh
    - -c
    - |
      printf 'Hello from %s\n' "$APP_VERSION" > /usr/share/nginx/html/index.html
      exec nginx -g 'daemon off;'
    ports:
    - name: http
      containerPort: 80
    readinessProbe:
      httpGet:
        path: /
        port: http
      periodSeconds: 3
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
