apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-liveness
  namespace: devops-homework
spec:
  restartPolicy: Always
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - touch /tmp/healthy; sleep 20; rm /tmp/healthy; sleep 3600
    livenessProbe:
      exec:
        command:
        - test
        - -f
        - /tmp/healthy
      initialDelaySeconds: 2
      periodSeconds: 3
      failureThreshold: 2
