apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-blue
  namespace: devops-homework
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue-green
      slot: blue
  template:
    metadata:
      labels:
        app: blue-green
        slot: blue
        version: blue
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        env:
        - name: APP_VERSION
          value: blue
        command:
        - /bin/sh
        - -c
        - |
          printf 'Hello from %s\n' "$APP_VERSION" > /usr/share/nginx/html/index.html
          exec nginx -g 'daemon off;'
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 3
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-green
  namespace: devops-homework
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue-green
      slot: green
  template:
    metadata:
      labels:
        app: blue-green
        slot: green
        version: green
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        env:
        - name: APP_VERSION
          value: green
        command:
        - /bin/sh
        - -c
        - |
          printf 'Hello from %s\n' "$APP_VERSION" > /usr/share/nginx/html/index.html
          exec nginx -g 'daemon off;'
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 3
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
---
apiVersion: v1
kind: Service
metadata:
  name: blue-green
  namespace: devops-homework
spec:
  type: ClusterIP
  selector:
    app: blue-green
    slot: blue
  ports:
  - name: http
    port: 80
    targetPort: http
