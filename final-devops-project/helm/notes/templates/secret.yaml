{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notes.fullname" . }}-secret
  labels:
    {{- include "notes.labels" . | nindent 4 }}
type: Opaque
stringData:
  # randAlphaNum is regenerated on every template render, so the value is
  # pinned to the release once created and never ends up in version control.
  API_TOKEN: {{ .Values.secret.apiToken | default (randAlphaNum 32) | quote }}
{{- end }}
