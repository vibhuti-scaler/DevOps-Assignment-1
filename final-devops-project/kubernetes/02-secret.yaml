# The committed value is a placeholder, not a credential. The real token is
# created out of band, which is why the manifest carries no data of its own:
#
#   kubectl -n notes create secret generic notes-secret \
#     --from-literal=API_TOKEN="$(openssl rand -hex 24)"
#
# Committing a Secret manifest with real base64 data is the mistake this
# comment exists to prevent: base64 is encoding, not encryption, and Git keeps
# it forever.
apiVersion: v1
kind: Secret
metadata:
  name: notes-secret
  namespace: notes
type: Opaque
stringData:
  API_TOKEN: REPLACE_WITH_A_GENERATED_TOKEN
