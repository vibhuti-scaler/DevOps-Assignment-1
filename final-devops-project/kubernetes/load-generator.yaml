# Not part of the deployment: a throwaway client used to push the HorizontalPod
# Autoscaler past its CPU target so the scaling behaviour can be observed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-load
  namespace: notes
  labels:
    app: notes-load
spec:
  replicas: 4
  selector:
    matchLabels:
      app: notes-load
  template:
    metadata:
      labels:
        app: notes-load
    spec:
      # The notes namespace enforces the restricted Pod Security Standard, so
      # even a throwaway load generator has to satisfy it. The first version of
      # this file did not, and the ReplicaSet could not create a single Pod:
      #   violates PodSecurity "restricted:latest": allowPrivilegeEscalation
      #   != false, unrestricted capabilities, runAsNonRoot != true,
      #   seccompProfile
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - 'while true; do wget -q -O- http://notes/api/notes >/dev/null 2>&1; done'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
