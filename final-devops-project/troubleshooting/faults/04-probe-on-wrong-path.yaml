# Fault 4: the readiness probe points at a path the application does not serve.
# Expected symptom: Pods Running but 0/1 Ready, Service endpoints empty, and
# no container restarts - readiness never restarts anything.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  namespace: notes
spec:
  template:
    spec:
      containers:
        - name: notes
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
