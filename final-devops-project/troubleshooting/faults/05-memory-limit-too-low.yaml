# Fault 5: the memory limit is below what gunicorn needs to start.
# Expected symptom: OOMKilled in the container's last state, then
# CrashLoopBackOff as the kubelet keeps restarting it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  namespace: notes
spec:
  template:
    spec:
      containers:
        - name: notes
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 24Mi
