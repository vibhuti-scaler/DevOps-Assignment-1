# Fault 3: the Deployment references a Secret key that does not exist.
# Expected symptom: the Pod is scheduled but never starts;
# CreateContainerConfigError, visible only in the Pod events.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  namespace: notes
spec:
  template:
    spec:
      containers:
        - name: notes
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notes-secret
                  key: TOKEN_THAT_DOES_NOT_EXIST
