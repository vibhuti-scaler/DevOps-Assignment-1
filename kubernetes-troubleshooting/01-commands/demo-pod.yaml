apiVersion: v1
kind: Pod
metadata:
  name: triage-demo
  labels:
    app: triage-demo
    lesson: troubleshooting
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
