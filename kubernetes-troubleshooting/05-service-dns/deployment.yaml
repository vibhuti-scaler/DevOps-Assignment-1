apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-demo
  labels:
    app: dns-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dns-demo
  template:
    metadata:
      labels:
        app: dns-demo
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
