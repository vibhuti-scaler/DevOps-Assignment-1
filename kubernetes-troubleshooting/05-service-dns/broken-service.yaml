apiVersion: v1
kind: Service
metadata:
  name: dns-demo
spec:
  selector:
    # The Pods carry app=dns-demo. This selector matches nothing, so the
    # EndpointSlice is empty and every request to the Service is refused even
    # though the Pods themselves are perfectly healthy.
    app: wrong-app
  ports:
    - port: 80
      targetPort: 80
