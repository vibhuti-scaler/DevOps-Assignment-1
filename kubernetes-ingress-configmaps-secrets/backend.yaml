apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-backend
  namespace: devops-homework
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-backend
  template:
    metadata:
      labels:
        app: demo-backend
        version: v1
    spec:
      containers:
      - name: backend
        image: python:3.13-alpine
        command:
        - python3
        - /app/app.py
        ports:
        - name: http
          containerPort: 5000
        envFrom:
        - configMapRef:
            name: demo-config
        env:
        - name: DEMO_TOKEN
          valueFrom:
            secretKeyRef:
              name: demo-credentials
              key: DEMO_TOKEN
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 3
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: code
        configMap:
          name: demo-backend-code
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
---
apiVersion: v1
kind: Service
metadata:
  name: demo-backend
  namespace: devops-homework
spec:
  type: ClusterIP
  selector:
    app: demo-backend
  ports:
  - name: http
    port: 80
    targetPort: http
