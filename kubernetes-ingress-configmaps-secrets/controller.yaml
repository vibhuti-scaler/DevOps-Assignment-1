apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-ingress
  namespace: devops-homework
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-ingress
  namespace: devops-homework
rules:
  - apiGroups: [""]
    resources: [services, secrets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-ingress
  namespace: devops-homework
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-ingress
subjects:
  - kind: ServiceAccount
    name: lab-ingress
    namespace: devops-homework
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vibhuti-lab-ingress
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vibhuti-lab-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vibhuti-lab-ingress
subjects:
  - kind: ServiceAccount
    name: lab-ingress
    namespace: devops-homework
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-ingress
  namespace: devops-homework
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-ingress
  template:
    metadata:
      labels:
        app: lab-ingress
    spec:
      serviceAccountName: lab-ingress
      containers:
        - name: traefik
          image: traefik:v3.6
          args:
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.namespaces=devops-homework
            - --providers.kubernetesingress.ingressclass=traefik
            - --entrypoints.web.address=:8000
            - --entrypoints.websecure.address=:8443
            - --ping=true
          ports:
            - name: web
              containerPort: 8000
            - name: websecure
              containerPort: 8443
            - name: ping
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ping
              port: ping
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lab-ingress
  namespace: devops-homework
spec:
  selector:
    app: lab-ingress
  ports:
    - name: web
      port: 80
      targetPort: web
    - name: websecure
      port: 443
      targetPort: websecure
