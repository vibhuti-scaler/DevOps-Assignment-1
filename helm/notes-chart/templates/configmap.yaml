apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notes-chart.fullname" . }}-config
  labels:
    {{- include "notes-chart.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.app.name | quote }}
  ENVIRONMENT: {{ .Values.app.environment | quote }}
  # The page the container serves is rendered from values, so the running Pod
  # proves which values file produced the release.
  index.html: |
    <!doctype html>
    <html lang="en">
      <head><meta charset="utf-8"><title>{{ .Values.app.name }}</title></head>
      <body>
        <h1>{{ .Values.app.message }}</h1>
        <p>release: {{ .Release.Name }}</p>
        <p>revision: {{ .Release.Revision }}</p>
        <p>environment: {{ .Values.app.environment }}</p>
        <p>image: {{ .Values.image.repository }}:{{ .Values.image.tag }}</p>
      </body>
    </html>
