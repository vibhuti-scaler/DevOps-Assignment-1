apiVersion: v1
kind: Pod
metadata:
  name: dynamic-pv-writer
  labels:
    app: dynamic-pv-writer
spec:
  restartPolicy: Never
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: dynamic-pvc
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - 'echo "provisioned dynamically" > /data/proof.txt && cat /data/proof.txt && sleep 3600'
      volumeMounts:
        - name: data
          mountPath: /data
