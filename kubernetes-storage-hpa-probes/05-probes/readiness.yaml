apiVersion: v1
kind: Pod
metadata:
  name: probe-readiness
  labels:
    app: probe-readiness
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          # Deliberately wrong: nginx answers 404 here, so the Pod runs but is
          # never Ready and its address never joins the Service EndpointSlice.
          path: /does-not-exist
          port: 80
        periodSeconds: 3
        failureThreshold: 1
