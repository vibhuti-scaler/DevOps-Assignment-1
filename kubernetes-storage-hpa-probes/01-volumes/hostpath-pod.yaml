apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  labels:
    app: hostpath-demo
spec:
  # hostPath binds a directory of the node itself into the Pod. DirectoryOrCreate
  # makes the kubelet create it when missing. Anything written here survives the
  # Pod, but it is tied to this one node, which is why it is a debugging tool
  # rather than a way to store application data.
  volumes:
    - name: node-dir
      hostPath:
        path: /var/lib/devops-homework/hostpath-demo
        type: DirectoryOrCreate
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - 'echo "written by $HOSTNAME" > /node/marker.txt && sleep 3600'
      volumeMounts:
        - name: node-dir
          mountPath: /node
