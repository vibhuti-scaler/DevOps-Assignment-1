apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: production-webapp
  labels:
    app: load-generator
spec:
  replicas: 4
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - 'while true; do wget -q -O- http://web-service >/dev/null 2>&1; done'
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
