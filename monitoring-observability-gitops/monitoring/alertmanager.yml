route:
  receiver: default
  group_by: [alertname, job]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  # A webhook that goes nowhere. A real deployment would point this at Slack,
  # email or PagerDuty; no such credential belongs in a public repository.
  - name: default
    webhook_configs:
      - url: http://127.0.0.1:9999/alerts
        send_resolved: true

inhibit_rules:
  # While a target is down its saturation alerts are meaningless noise.
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: [instance]
