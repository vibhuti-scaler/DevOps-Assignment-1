apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-api-default-deny
  namespace: task-api
spec:
  # Start from "nothing is allowed" and open only what the application needs.
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-api-allow
  namespace: task-api
spec:
  podSelector:
    matchLabels:
      app: task-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: task-api-client
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS only. The service talks to nothing else, so nothing else is allowed.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
