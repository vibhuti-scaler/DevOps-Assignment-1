# Session 16 - continuous integration.
# Every push and pull request runs the same three stages: lint, test on a
# matrix of Python versions, then build the image and keep the result as an
# artifact. Nothing here deploys; that is the CD workflow's job.
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'cicd-github-actions/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: cicd-github-actions

env:
  PYTHON_DEFAULT: '3.12'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Run flake8
        run: flake8 app tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      # One failing version should not hide the result of the others.
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Run the unit tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term --junitxml=test-results.xml
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            cicd-github-actions/test-results.xml
            cicd-github-actions/coverage.xml
          retention-days: 7

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the application image
        run: docker build -t task-api:${{ github.sha }} .
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8000:8000 task-api:${{ github.sha }}
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep '"status": "ok"'
          docker rm -f smoke
      - name: Save the image as a build artifact
        run: docker save task-api:${{ github.sha }} | gzip > task-api.tar.gz
      - name: Upload the image artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-api-image
          path: cicd-github-actions/task-api.tar.gz
          retention-days: 7
